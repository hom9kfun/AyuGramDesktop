name: WEB proxy backport

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    branches: [dev]

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 Release
    if: "${{ github.event.pull_request.head.ref == 'web-proxy-backport' && github.event.pull_request.head.repo.full_name == github.repository }}"
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: web-proxy-backport
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Initialize MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: 14.44
          sdk: 10.0.26100.0

      - name: Prepare build directories
        shell: cmd
        run: |
          if not exist Libraries mkdir Libraries
          if not exist ThirdParty mkdir ThirdParty

      - name: Prepare libraries
        shell: cmd
        run: call Telegram\build\prepare\win.bat skip-release silent

      - name: Configure Release
        shell: cmd
        working-directory: Telegram
        run: call configure.bat x64 -D TDESKTOP_API_ID=2040 -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627 -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT=

      - name: Build Release
        shell: cmd
        working-directory: Telegram
        run: cmake --build ..\out --config Release --parallel

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'out\Release\Telegram.exe'
          if (-not (Test-Path $exe)) { throw "Release executable not found: $exe" }
          $item = Get-Item $exe
          Write-Host "Built $($item.FullName) ($($item.Length) bytes)"

      - name: Package Windows release
        shell: pwsh
        run: |
          $release = Join-Path $env:GITHUB_WORKSPACE 'out\Release'
          $zip = Join-Path $env:GITHUB_WORKSPACE 'AyuGramDesktop-Windows-x64-WEBProxy.zip'
          Compress-Archive -Path "$release\*" -DestinationPath $zip -CompressionLevel Optimal -Force

      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v7
        with:
          name: AyuGramDesktop-Windows-x64-WEBProxy
          path: AyuGramDesktop-Windows-x64-WEBProxy.zip
          if-no-files-found: error
